[project]
name = "ppg-hr"
version = "0.1.0"
description = "Heart rate from wrist PPG: classical DSP vs neural network, emulated embedded C firmware, multi-level tests"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "torch>=2.15.0",
    "opencv-python>=4.10,<5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

# On Linux (CI) use the CPU-only PyTorch wheels: the default ones bundle CUDA (several GB)
# and the tests only run inference.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
# The importable package lives in python/ppg_hr (not src/), so point the backend there.
module-root = "python"
module-name = "ppg_hr"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--strict-markers"
markers = [
    "dataset: needs PPG-DaLiA in data/processed",
    "firmware: builds and runs the C firmware on the host",
    "sil: software-in-the-loop over a serial port",
    "renode: needs the Renode emulator",
]
